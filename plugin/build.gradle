// OrbisFox Bridge - build with:  gradle build   (Java 25)
// The Hytale server API comes from Hytale's public Maven repository. To build against the
// HytaleServer.jar of your own server instead:  gradle build -PhytaleServerJar=C:/path/HytaleServer.jar
plugins {
    id 'java'
}

group = 'com.alphafoxtrot'
version = '1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.hytale.com/release') }
    maven { url = uri('https://maven.hytale.com/pre-release') }
}

dependencies {
    if (project.hasProperty('hytaleServerJar')) {
        compileOnly files(project.property('hytaleServerJar'))
    } else {
        compileOnly "com.hypixel.hytale:Server:${project.findProperty('hytaleVersion') ?: '0.7.7'}"
    }
}

jar {
    archiveFileName = 'OrbisFoxBridge.jar'
    destinationDirectory = file('dist')
}
